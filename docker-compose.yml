# PostgreSQL for the backend's "prod" profile (dev uses an H2 file database and needs nothing).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dars
      POSTGRES_USER: dars
      POSTGRES_PASSWORD: dars
    ports:
      - "5432:5432"
    volumes:
      - dars-pg:/var/lib/postgresql/data

volumes:
  dars-pg:
